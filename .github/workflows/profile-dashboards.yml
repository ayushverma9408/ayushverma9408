name: Update profile coding dashboards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-dashboards.yml"
      - "scripts/generate_profile_cards.py"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-dashboards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync latest profile README changes
        run: git pull --rebase origin main
      - name: Generate SVG dashboard cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile_cards.py
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile coding dashboards" && git push)
